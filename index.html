        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 mb-6">

            <input type="number" id="in-altezza" placeholder="Altezza (cm)" class="border p-2 rounded w-full">
            <select id="in-attivita" class="border p-2 rounded w-full">

                <option value="1.9">Atleta (1.9)</option>
            </select>
        </div>
        <h2 class="text-lg font-bold mb-4 text-slate-700">Misure Antropometriche</h2>
        <div id="cont-antropometriche" class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-6"></div>
        <h2 class="text-lg font-bold mb-4 text-slate-700 border-t pt-4">Rilevazioni Plicometriche</h2>
        <div id="cont-pliche" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
        <button onclick="calcolaEGenera()" class="w-full mt-6 bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition-colors">Calcola e Genera Report</button>
    </div>
