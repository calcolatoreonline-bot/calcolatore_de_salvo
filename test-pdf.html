<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Test Isolato html2pdf - Soluzione Definitiva Base64</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .pagina-a4 {
            width: 210mm;
            height: 297mm;
            padding: 20mm;
            background-color: white;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body style="background-color: #f0f0f0; font-family: sans-serif; padding: 20px;">

    <div style="margin-bottom: 20px; text-align: center;">
        <button id="btn-esporta" onclick="scaricaPDFClientSide()" style="padding: 10px 20px; font-size: 16px; background-color: #059669; color: white; border: none; border-radius: 5px; cursor: pointer;">
            📥 Clicca qui per scaricare il PDF Completo con Logo
        </button>
    </div>

    <div id="pdf-content" class="pagina-a4">
        <h1>PRIMA PAGINA</h1>
        <p>Questo è un testo di test per la pagina 1.</p>
        <img id="logo-test" src="logo_de_salvo_transparent.png" style="width: 150px; margin-top: 20px;" alt="[Logo Test]">
    </div>

    <div id="elite-content" class="pagina-a4">
        <h1>SECONDA PAGINA (ELITE)</h1>
        <p>Questo è un testo di test per la pagina 2.</p>
        <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
            <tr>
                <th style="border: 1px solid black; padding: 8px;">Parametro</th>
                <th style="border: 1px solid black; padding: 8px;">Valore</th>
            </tr>
            <tr>
                <td style="border: 1px solid black; padding: 8px;">Peso</td>
                <td style="border: 1px solid black; padding: 8px;">70 Kg</td>
            </tr>
        </table>
    </div>

    <script>
        // Funzione Helper asincrona per convertire al volo qualsiasi URL immagine in stringa Base64 sicura per il Canvas
        function toBase64(imgElement) {
            return new Promise((resolve) => {
                // Se è già in base64 o non è valida, saltiamo la conversione
                if (!imgElement || imgElement.src.startsWith('data:')) {
                    resolve(imgElement ? imgElement.src : '');
                    return;
                }
                
                const img = new Image();
                img.crossOrigin = 'Anonymous'; // Forza lo sblocco CORS lato client se supportato
                img.src = imgElement.src;
                
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    try {
                        // Estraiamo i dati in formato PNG nativo
                        const dataURL = canvas.toDataURL('image/png');
                        resolve(dataURL);
                    } catch (e) {
                        console.error("Errore esportazione Canvas:", e);
                        resolve(imgElement.src); // Fallback all'originale in caso di blocco severo
                    }
                };
                
                img.onerror = function() {
                    resolve(imgElement.src);
                };
            });
        }

        async function scaricaPDFClientSide() {
            const btn = document.getElementById('btn-esporta');
            btn.disabled = true;
            btn.innerText = "⏳ Elaborazione Grafica e PDF...";

            try {
                const tempWrapper = document.createElement('div');
                tempWrapper.style.position = 'relative';
                tempWrapper.style.width = '210mm';
                tempWrapper.style.backgroundColor = '#ffffff';
                
                // Clona i nodi della pagina originale
                const page1 = document.getElementById('pdf-content').cloneNode(true);
                const page2 = document.getElementById('elite-content').cloneNode(true);
                
                // 🚀 CONVERSIONE AUTOMATICA DELLE IMMAGINI DEL CLONE IN BASE64
                const cloneImages = page1.querySelectorAll('img');
                for (let img of cloneImages) {
                    const base64Src = await toBase64(img);
                    img.src = base64Src; // Ora l'immagine del clone è testo puro al 100%!
                }

                const pageBreak = document.createElement('div');
                pageBreak.className = 'html2pdf__page-break';

                tempWrapper.appendChild(page1);
                tempWrapper.appendChild(pageBreak);
                tempWrapper.appendChild(page2);

                document.body.appendChild(tempWrapper);

                const opt = {
                    margin: 0,
                    filename: 'test-grafica-funzionante.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { 
                        scale: 2, 
                        useCORS: true, 
                        allowTaint: false, // Lasciamo rigorosamente false per sfruttare la pulizia del Base64
                        backgroundColor: '#ffffff',
                        logging: false
                    },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                    pagebreak: { mode: 'css' }
                };

                html2pdf().set(opt).from(tempWrapper).save().then(() => {
                    document.body.removeChild(tempWrapper);
                    btn.disabled = false;
                    btn.innerText = "📥 Clicca qui per scaricare il PDF Completo con Logo";
                    console.log("PDF grafico generato con successo!");
                }).catch(err => {
                    console.error("Errore durante il salvataggio:", err);
                    if (document.body.contains(tempWrapper)) document.body.removeChild(tempWrapper);
                    btn.disabled = false;
                    btn.innerText = "❌ Errore di Scatto";
                });

            } catch (error) {
                console.error("Errore generico:", error);
                btn.disabled = false;
                btn.innerText = "❌ Errore Generico";
            }
        }
    </script>
</body>
</html>
